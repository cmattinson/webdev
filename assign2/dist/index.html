<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Presentation Feedback System</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <script id="presenters-template" type="text/x-dot-template">
            <table id="presenters-table" class="table">
                {{~it :value:index}}
                <tr>
                    <td><a href="#{{=value.presentationID}}">{{=value.firstName}} {{=value.lastName}}</a></td>
                </tr>
                {{~}}
            <table>
        </script>
        <script id="presenter-info-template" type="text/x-dot-template">
            <table id="presenter" class="table">
                <tr><td><a>Title - {{=it.title}}</a></td></tr>
                <tr><td><a>Presenter - {{=it.firstName}} {{=it.lastName}}</a></td></tr>
                <tr><td><a>Date - {{=it.date}}</a></td></tr>
                <tr><td><a>Time - {{=it.time}}</a></td></tr>
            <table>
        </script>
        <script id="question-template" type=text/x-dot-template">
            <table id="questions-table" class="table">
                {{~it :value:index}}
                <tr><td><a>{{=value.type}} {{=value.number}} - {{=value.prompt}}</a></td></tr>
                <tr><td>
                    {{? value.type === "M/C"}}
                <div>
                    <input type="radio" id="stronglyAgree"
                        name="choice" value="Strongly Agree">
                    <label for="stronglyAgree">Strongly Agree</label>

                    <input type="radio" id="Agree"
                    name="choice" value="Agree">
                    <label for="Agree">Agree</label>

                    <input type="radio" id="neutral"
                    name="choice" value="Neutral">
                    <label for="neutral">Neutral</label>

                    <input type="radio" id="disagree"
                    name="choice" value="Disagree">
                    <label for="disagree">Disagree</label>

                    <input type="radio" id="stronglyDisagree"
                    name="choice" value="Strongly Disagree">
                    <label for="stronglyDisagree">Strongly Disagree</label>
                </div>
                {{??}}
                <div>
                    <textarea rows="5" columns="100"></textarea>
                </div>

                {{?}}
                </td></tr>
                {{~}}
            <table>
        </script>
        <script id="error-template" type="text/x-dot-template">
            <div> Error {{=it.statusCode}}</div>      
        </script>
    </head>
    <body>
        <section class="active" id="auth-section">
            <h2>Enter your identifier</h2> 
            <input id="id-box" type="text">
            <button id="submit-button" type="button">Submit</button>
            </section>
        <section id="error-page">
            <h2>Error</h2>
            <p id="error">

            </p>
        </section>
        <section id="navigation">
                <h2>Presentation Feedback System</h2>
                <nav id="nav-bar">
                        <ul id="nav-items">
                            <li id="nav-presenters"><a href="#">Presenters</a></li>
                            <li id="nav-responses"><a href="#">Responses</a></li>
                        </ul>
                </nav>
        </section>
        <section id="presenters-section">
            <h2>Presenters</h2>
            <p id="presenters">
            </p>
        </section>
        <section id="responses-section">
            <h2>Responses</h2>
            <p id="responses-list">
            </p>
        </section>
        <section id="presenter-info-section">
            <h2>Presentation</h2>
            <p id="presenter-info">

            </p>
        </section>
        <section id="questions-section">
            <p id="questions">

            </p>
        </section>
        <script src="doT.js"></script>
        <script src="app.js"></script>
    </body>
</html>
