<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Presentation Feedback System</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script id="presenters-template" type="text/x-dot-template">
            <div class="presenters-list">
                {{~it :value:index}}
                    <ul>
                        <a href="#{{=value.presentationID}}">{{=value.firstName}} {{=value.lastName}}</a>
                    </ul>
                {{~}}
            </div>
        </script>
    <script id="presenter-info-template" type="text/x-dot-template">
            <div class="presenter-info">
                <ul>
                    <li><a>Title - {{=it.title}}</a></li>
                    <li><a>Presenter - {{=it.firstName}} {{=it.lastName}}</a></li>
                    <li><a>Date - {{=it.date}}</a></li>
                    <li><a>Time - {{=it.time}}</a></li>
                </ul>
            </div>
        </script>
    <script id="question-template" type="text/x-dot-template">
            <table id="questions-table" class="table">
                {{~it :value:index}}
                <tr><td><a>{{=value.prompt}}</a></td></tr>
                <tr><td>
                    {{? value.type === "M/C"}}
                <div id="radio-buttons">
                    <input type="radio" id="stronglyAgree"
                        name="multChoice{{=index}}" value="Strongly Agree">
                    <label for="stronglyAgree">Strongly Agree</label>

                    <input type="radio" id="Agree"
                    name="multChoice{{=index}}" value="Agree">
                    <label for="Agree">Agree</label>

                    <input type="radio" id="neutral"
                    name="multChoice{{=index}}" value="Neutral">
                    <label for="neutral">Neutral</label>

                    <input type="radio" id="disagree"
                    name="multChoice{{=index}}" value="Disagree">
                    <label for="disagree">Disagree</label>

                    <input type="radio" id="stronglyDisagree"
                    name="multChoice{{=index}}" value="Strongly Disagree">
                    <label for="stronglyDisagree">Strongly Disagree</label>
                </div>
                {{??}}
                <div>
                    <textarea name="open{{=index}}" rows="10" cols="50"></textarea>
                </div>
                {{?}}
                </td></tr>
                {{~}}
            <table>
        </script>
    <script id="error-template" type="text/x-dot-template">
            <p> 
                <h2>Error {{=it.statusCode}}</h2>

                <h3>{{=it.message}}</h3>
            </p>      
        </script>
</head>

<body>
    <section id="header-section">
        <h6>Header</h6>
        <div class="title-bar">
            <ul id="title-items">
                <li class="active"><b>Presentation Feedback System</b></li>
                <li class="active"><a href="#all-presenters">All Presenters</a></li>
                <li><select id="other-presenters-select">
                        <option selected disabled hidden>Other Presenters</option>
                    </select></li>
                <li><select id="other-presentations-select">
                        <option selected disabled hidden>Other Presentations</option>
                    </select></li>
                <li class="active" class="right"><a href="#log-out">Log Out</a></li>
            </ul>
        </div>
    </section>
    <section class="active" id="auth-section">
        <h6>Authentication</h6>
        <div class="auth-box">
            <ul class="auth-list">
                <li>
                    <h2>Presentation Feedback System</h2>
                </li>
                <li><input id="id-box" type="text" placeholder="Identifier"></li>
                <li><button id="submit-button" type="button">Submit</button></li>
            </ul>
        </div>
    </section>
    <section id="error-page">
        <h6>Error</h6>
        <p id="error">

        </p>
    </section>
    <section id="presenters-section">
        <h1>Presenters</h1>
        <p id="presenters">
        </p>
    </section>
    <section id="presenter-info-section">
        <h2>Presentation</h2>
        <p id="presenter-info">

        </p>
    </section>
    <section id="questions-section">
        <h2>Questions</h2>
        <p id="questions">
        </p>
        <button id="submit-responses" type="button">Save and Close</button>
    </section>
    <script src="doT.js"></script>
    <script src="listeners.js"></script>
    <script src="app.js"></script>
</body>

</html>
